[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "Basic_OPCUA_Server"
version = "0.1.0"
description = "Pure Python OPC-UA client and server library"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "asyncua>=1.2b2",
    "customtkinter",
    "Pillow"
]
